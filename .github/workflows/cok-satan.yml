name: Haftalık çok satanlar

on:
  schedule:
    # Pazartesi 06:15 UTC. İstanbul sabahı. Günlük makale ile aynı yayın grubu.
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      yenile_hafta:
        description: "Bu haftanın çok satan yazılarını yeniden üret"
        type: boolean
        default: false
      kisa_adet:
        description: "Kısa günlük yazılardan bu turda yenilenecek adet. 0 ise dokunulmaz."
        default: "0"
  push:
    # content/yenile_istek.json main'e düşünce tur başlar. Bot dosyayı false/0 yapınca
    # gelen ikinci çalışmada istek yoktur; iş commit atmadan çıkar, döngü oluşmaz.
    branches: [main]
    paths:
      - content/yenile_istek.json

permissions:
  contents: write

concurrency:
  group: site-yayin
  cancel-in-progress: false

jobs:
  cok-satan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: İsteği oku
        id: istek
        run: |
          OLAY="${{ github.event_name }}"
          YENILE="false"
          KISA="0"
          SKIP="false"
          if [ "$OLAY" = "workflow_dispatch" ]; then
            YENILE="${{ inputs.yenile_hafta }}"
            KISA="${{ inputs.kisa_adet || '0' }}"
          elif [ "$OLAY" = "push" ]; then
            python3 - << 'PY'
          import json
          try:
              d = json.load(open("content/yenile_istek.json", encoding="utf-8"))
          except FileNotFoundError:
              d = {}
          yenile = d.get("yenile_hafta") in (True, "true", "True", 1, "1")
          try:
              adet = int(d.get("kisa_adet") or 0)
          except (TypeError, ValueError):
              adet = 0
          if adet < 0:
              adet = 0
          open("/tmp/istek.env", "w", encoding="utf-8").write(
              f"YENILE={'true' if yenile else 'false'}\nKISA={adet}\n"
          )
          PY
            # shellcheck disable=SC1091
            . /tmp/istek.env
            if [ "$YENILE" != "true" ] && [ "$KISA" = "0" ]; then
              echo "İstek yok. Botun kapattığı dosya döngü başlatmaz."
              SKIP="true"
            fi
          fi
          echo "olay=$OLAY" >> "$GITHUB_OUTPUT"
          echo "yenile=$YENILE" >> "$GITHUB_OUTPUT"
          echo "kisa=$KISA" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.istek.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - if: steps.istek.outputs.skip != 'true'
        run: pip install jinja2

      - name: Listeyi çek ve yaz
        if: steps.istek.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_YEDEK: ${{ vars.GEMINI_MODEL_YEDEK || 'gemini-flash-lite-latest' }}
        run: |
          git config user.name "hobibul-bot"
          git config user.email "hobibul-bot@users.noreply.github.com"
          OLAY="${{ steps.istek.outputs.olay }}"
          YENILE="${{ steps.istek.outputs.yenile }}"
          KISA="${{ steps.istek.outputs.kisa }}"
          # Amazon 503 veya captcha verirse betik 0 ile çıkar, siteyi bozmaz.
          # Anahtar varsa çok satan metnini Gemini yazar; yoksa kısa yedek metin kalır.
          if [ "$YENILE" = "true" ]; then
            python cok_satan.py --yenile || echo "çok satanlar yenileme hata verdi, yayın sürüyor"
          elif [ "$OLAY" != "push" ]; then
            python cok_satan.py --yaz || echo "çok satanlar adımı hata verdi, yayın sürüyor"
          fi
          if [ "$KISA" != "0" ] && [ -n "$KISA" ]; then
            python otomatik.py --kisa-yenile "$KISA" || echo "kısa yazı adımı hata verdi, yayın sürüyor"
          fi
          if [ "$OLAY" = "push" ]; then
            python3 - << 'PY'
          import json
          with open("content/yenile_istek.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump({"yenile_hafta": False, "kisa_adet": 0}, f, ensure_ascii=False, indent=1)
              f.write("\n")
          PY
          fi
          python build.py
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "Haftalık çok satanlar $(date -u +%G-W%V)"
          # Aynı yayın grubundaki başka iş main'i ilerletirse commit'i üste alıp yeniden dene.
          deneme=1
          while [ "$deneme" -le 3 ]; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push başarısız (deneme ${deneme}/3)."
            if [ "$deneme" -eq 3 ]; then
              exit 1
            fi
            git fetch origin main
            git rebase origin/main || exit 1
            deneme=$((deneme + 1))
          done
