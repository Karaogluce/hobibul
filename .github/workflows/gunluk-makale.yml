name: Günlük makale

on:
  schedule:
    # Her gün tam 2 makale. 11:00 TR — Gemini günlük kotası Pasifik gece yarısı sıfırlanır.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      adet:
        description: "Üretilecek makale sayısı (otomatik.py 2'den fazlasını 2'ye çeker)"
        default: "2"
  push:                         # taslağı onaylayıp (draft: "false") kaydedince siteyi yeniden üretir
    branches: [main]
    paths: ["content/**", "templates/**", "static/**", "build.py"]

permissions:
  contents: write

concurrency:
  group: gunluk-makale
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jinja2

      - name: Makale üret
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_YEDEK: ${{ vars.GEMINI_MODEL_YEDEK }}
          TASLAK_MODU: ${{ vars.TASLAK_MODU || 'false' }}
        # Zamanlanmış çalıştırma girdi almaz; varsayılan tam 2. Elle tetikte de üst sınır 2'dir.
        run: python otomatik.py --adet ${{ github.event.inputs.adet || '2' }}

      - name: Siteyi üret
        run: python build.py

      - name: Commit ve yayınla
        run: |
          git config user.name "hobibul-bot"
          git config user.email "hobibul-bot@users.noreply.github.com"
          git add -A
          git diff --cached --name-only > "$RUNNER_TEMP/degisen.txt"
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Otomatik güncelleme $(date -u +%F)"
          git pull --rebase
          git push

      - name: IndexNow bildirimi
        run: python indexnow.py --degisen "$RUNNER_TEMP/degisen.txt"
