name: Günlük makale

on:
  schedule:
    # Her 30 dakikada bir, İstanbul gününde 5 makale dolana kadar otomatik.py kalanı üretir.
    # */30 dakika :00 ve :30'a denk gelir; GitHub Actions bu dilimleri yük altında
    # geciktirir veya hiç başlatmaz. Aynı tempo, kalabalığın dışında iki ayrı zamanlama.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      adet:
        description: "Bu çalışmada denenecek makale sayısı (varsayılan 5). Günlük tavan 5; bugün yazılanlar düşülür."
        default: "5"
  push:                         # taslağı onaylayıp (draft: "false") kaydedince siteyi yeniden üretir
    branches: [main]
    paths: ["content/**", "templates/**", "static/**", "build.py", "deeplink.py"]

permissions:
  contents: write

concurrency:
  group: site-yayin
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jinja2

      - name: Commit ve yayınla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Variable boşsa yerleşik yedek. Günlük kota (429), 503/UNAVAILABLE, zaman aşımı
          # ve bağlantı hatası otomatik.py içinde exit 0 ile biter; biten makaleler kalır.
          # Eksik GEMINI_API_KEY hâlâ kırmızı fail. Secret değeri buraya yazılmaz.
          GEMINI_MODEL_YEDEK: ${{ vars.GEMINI_MODEL_YEDEK || 'gemini-flash-lite-latest' }}
          TASLAK_MODU: ${{ vars.TASLAK_MODU || 'false' }}
        # Zamanlanmış çalıştırma girdi almaz; varsayılan 5. Gün doluysa betik hemen çıkar.
        # fetch/reset üretimi siler; bu yüzden makale ve site üretimi döngünün içindedir.
        run: |
          git config user.name "hobibul-bot"
          git config user.email "hobibul-bot@users.noreply.github.com"
          deneme=1
          while [ "$deneme" -le 3 ]; do
            git fetch origin main
            git reset --hard origin/main
            if [ "${{ github.event_name }}" != "push" ]; then
              python otomatik.py --adet "${{ github.event.inputs.adet || '5' }}"
            fi
            python build.py
            git add -A
            git diff --cached --name-only > "$RUNNER_TEMP/degisen.txt"
            if git diff --cached --quiet; then
              echo "Değişiklik yok"
              exit 0
            fi
            git commit -m "Otomatik güncelleme $(date -u +%F)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push başarısız (deneme ${deneme}/3)."
            if [ "$deneme" -eq 3 ]; then
              echo "Push 3 denemede olmadı."
              exit 1
            fi
            deneme=$((deneme + 1))
            sleep $((deneme * 5))
          done

      - name: IndexNow bildirimi
        run: python indexnow.py --degisen "$RUNNER_TEMP/degisen.txt"
